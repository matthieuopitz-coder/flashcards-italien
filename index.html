<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#009246" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Flashcards" />
  <style>
    :root {
      --primary: #009246; --success: #009246; --danger: #CE2B37;
      --soft: #eef7f1; --bg: #E3EEEA; --footer-text: #a1b3ad;
      --appbg: linear-gradient(135deg, #17a55a 0%, #17a55a 32%, #0a5fb8 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); min-height: 100vh; touch-action: manipulation; }
    body.review-mode { background: #f3ecdd; }
    #root { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem 3rem 1rem; }
    h2 { text-align: center; font-size: 22px; font-weight: 500; margin-bottom: 20px; }
    .tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 24px; }
    .tab { padding: 9px 20px; border-radius: 20px; border: none; cursor: pointer; font-size: 16px; font-weight: 500; background: transparent; color: #555; transition: all 0.2s; }
    .tab.active { background: var(--primary); color: #fff; }
    .session-bar { display: flex; justify-content: space-between; font-size: 15px; color: #888; margin-bottom: 12px; }

    .card-wrap { perspective: 1000px; cursor: pointer; height: 340px; margin-bottom: 20px; }
    .card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.5s; border-radius: 16px; }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 1.2rem;
      background: #fff; border: 2.5px solid #bbb;
    }
    body.review-mode .card-face { border-color: #C79A3B; }
    .card-back { transform: rotateY(180deg); }
    .card-emoji { font-size: 56px; }
    .card-word { font-size: 30px; font-weight: 600; text-align: center; overflow-wrap: break-word; max-width: 100%; line-height: 1.2; }
    .card-sub { font-size: 20px; font-weight: 400; text-align: center; color: #555; overflow-wrap: break-word; max-width: 100%; line-height: 1.2; }
    .card-example { font-size: 16px; font-style: italic; text-align: center; color: #777; overflow-wrap: break-word; max-width: 100%; line-height: 1.3; }
    .card-example.first { margin-top: 6px; }
    .card-example.second { margin-top: -6px; }
    .card-lang { font-size: 26px; letter-spacing: 4px; }
    .card-hint { font-size: 13px; color: #bbb; margin-top: 2px; }

    .review-banner { text-align: center; background: #e8dab5; color: #7a5c1a; font-size: 16px; font-weight: 500; padding: 8px 12px; border-radius: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .review-banner button { background: none; border: none; color: #7a5c1a; font-size: 16px; cursor: pointer; text-decoration: underline; }

    .answer-btns { display: flex; gap: 12px; margin-bottom: 6px; }
    .btn-wrong { flex: 1; padding: 14px 0; border-radius: 12px; border: 1.5px solid var(--danger); background: #fff; color: var(--danger); font-size: 19px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s; user-select: none; -webkit-user-select: none; }
    .btn-wrong.flash { background: var(--danger); color: #fff; }
    .btn-right { flex: 1; padding: 14px 0; border-radius: 12px; border: 1.5px solid var(--success); background: #fff; color: var(--success); font-size: 19px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s; user-select: none; -webkit-user-select: none; }
    .btn-right.flash { background: var(--success); color: #fff; }
    .btn-hint { text-align: center; font-size: 12px; color: #a0a0a0; margin-top: 2px; }
    .btn-filter { display: block; margin: 0 auto 16px; padding: 8px 20px; border-radius: 20px; border: 1.5px solid #ccc; background: #fff; color: #555; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-filter.active { border-color: var(--primary); color: var(--primary); background: var(--soft); }
    .btn-audio { background: none; border: none; cursor: pointer; font-size: 27px; line-height: 1; padding: 2px 6px; }
    .btn-audio-sm { background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; vertical-align: middle; }
    .btn-audio:active { transform: scale(0.9); }

    .form-card { background: #fff; border: 1px solid #999; border-radius: 16px; padding: 1.5rem; margin-bottom: 16px; }
    .form-label { font-size: 16px; color: #444; font-weight: 600; display: block; margin-bottom: 4px; }
    .form-input { width: 100%; padding: 11px 13px; border: 1px solid #bbb; border-radius: 8px; font-size: 16px; margin-bottom: 14px; outline: none; background: #f7f7f4; }
    .form-input:focus { border-color: var(--primary); background: #fff; }
    .btn-add { width: 100%; padding: 14px 0; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 17px; font-weight: 500; cursor: pointer; }
    .add-msg { margin-top: 12px; text-align: center; font-size: 15px; }
    .add-msg.ok { color: var(--success); }
    .add-msg.err { color: var(--danger); }

    .deck-top { display: flex; gap: 10px; margin-bottom: 16px; }
    .search-box { flex: 1; padding: 8px 13px; border: 1px solid #bbb; border-radius: 12px; font-size: 15px; outline: none; background: #fff; }
    .search-box:focus { border-color: var(--primary); }
    .export-btns { display: flex; gap: 10px; margin-bottom: 16px; }
    .btn-export { flex: 1; padding: 12px 0; border-radius: 12px; border: 1.5px solid var(--primary); background: transparent; color: var(--primary); font-size: 15px; font-weight: 500; cursor: pointer; }
    .btn-import { flex: 1; padding: 12px 0; border-radius: 12px; border: 1.5px solid #888; background: transparent; color: #888; font-size: 15px; font-weight: 500; cursor: pointer; }

    .list-block { background: #fff; border: 1px solid #999; border-radius: 16px; padding: 1rem 1.25rem; margin-bottom: 16px; }
    .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .list-title { font-size: 17px; font-weight: 600; }
    .list-title .count { color: var(--primary); font-weight: 600; }
    .list-scroll { max-height: 320px; overflow-y: auto; }
    .collapse-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: #888; display: flex; align-items: center; gap: 6px; }
    .stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 15px; user-select: none; }
    .stat-row-word { flex: 1; cursor: pointer; padding: 2px 4px; border-radius: 6px; transition: background 0.2s; }
    .stat-row-word:active { background: #f0f0e8; }
    .mastered-block { background: #f3ecdd; border-color: #b09660; }
    .btn-review-mastered { width: 100%; padding: 11px 0; border-radius: 12px; border: 1.5px solid #C79A3B; background: transparent; color: #9a7524; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 12px; }
    .row-plus { background: #f0f0eb; border: 1px solid #bbb; border-radius: 7px; cursor: pointer; font-size: 19px; width: 27px; height: 27px; padding: 0; color: #666; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .footer { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--footer-text); padding: 6px 0 8px; background: var(--bg); }
    body.review-mode .footer { background: #f3ecdd; }
    .footer .version { color: #bbb; margin-left: 6px; }
    .sync-status { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 10px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal { background: #fff; border: 1px solid #ccc; border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 420px; position: relative; }
    .modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; padding-right: 30px; }
    .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 22px; color: #aaa; cursor: pointer; line-height: 1; }
    .modal-desc { font-size: 13px; color: #aaa; margin-bottom: 16px; line-height: 1.4; }
    .modal-option { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1.5px solid #ddd; background: transparent; color: #222; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; text-align: left; transition: background 0.15s, color 0.15s; }
    .modal-option:hover { background: #f5f5f0; }
    .modal-option.danger { color: var(--danger); border-color: var(--danger); }
    .modal-option.sideline { border-color: #2B7FCE; color: #2B7FCE; }
    .modal-option.priority { border-color: #E08A1E; color: #E08A1E; }
    .modal-option.archive { border-color: #C79A3B; color: #9a7524; }
    .modal-option.reactivate { border-color: var(--success); color: var(--success); }
    .modal-option.flash-blue { background: #2B7FCE; color: #fff; }
    .modal-option.flash-orange { background: #E08A1E; color: #fff; }
    .modal-option.flash-gold { background: #C79A3B; color: #fff; }
    .modal-option.flash-green { background: var(--success); color: #fff; }
    .modal-option.flash-red { background: var(--danger); color: #fff; }
    .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
    .btn-cancel { flex: 1; padding: 12px 0; border-radius: 12px; border: 1.5px solid #ddd; background: transparent; color: #888; font-size: 15px; cursor: pointer; }
    .btn-save { flex: 1; padding: 12px 0; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; }

    /* Écran de connexion / choix */
    .login-wrap { max-width: 420px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; }
    .login-wrap h1 { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
    .login-wrap p { font-size: 15px; color: #666; line-height: 1.5; margin-bottom: 24px; }
    .login-input { width: 100%; padding: 13px 15px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; margin-bottom: 14px; outline: none; }
    .login-input:focus { border-color: var(--primary); }
    .login-btn { width: 100%; padding: 14px 0; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    .login-btn:disabled { opacity: 0.6; cursor: wait; }
    .login-sep { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; color: #bbb; font-size: 13px; }
    .login-sep span { flex: 1; height: 1px; background: #ddd; }
    .btn-google { width: 100%; padding: 13px 0; border-radius: 12px; border: 1px solid #ccc; background: #fff; color: #333; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-google:disabled { opacity: 0.6; cursor: wait; }
    .g-logo { width: 18px; height: 18px; flex-shrink: 0; }
    .login-msg { margin-top: 16px; font-size: 14px; line-height: 1.5; }
    .login-msg.ok { color: var(--success); }
    .login-msg.err { color: var(--danger); }
    .logout-link { background: none; border: none; color: #aaa; font-size: 13px; cursor: pointer; text-decoration: underline; }

    .pick-btn { display: flex; align-items: center; gap: 12px; width: 100%; border: 1.5px solid #dce4ee; border-radius: 14px; padding: 16px; margin-bottom: 14px; font-size: 16px; font-weight: 600; color: #163a66; background: #fff; cursor: pointer; text-align: left; }
    .pick-btn .pfl { font-size: 17px; letter-spacing: 1px; }
    .pick-btn:hover { border-color: #0055A4; background: #f2f6fb; }

    /* Charte « marque » (avant le choix de la langue : connexion / choix / chargement) */
    body.brand { background: linear-gradient(145deg, #e9f4ee 0%, #e7eef7 55%, #e4edf8 100%); }
    body.brand .footer { background: transparent; }
    body.brand .brandname {
      background: linear-gradient(120deg, #0f9b54 0%, #0a5fb8 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    body.brand .login-btn { background: linear-gradient(120deg, #17a55a 0%, #0a5fb8 100%); }
    body.brand .login-input:focus { border-color: #1f7fb8; }
    body.brand .pick-btn:hover { border-color: #0a5fb8; background: #eef3fb; }

    /* ===== Fond dégradé, piloté par la langue apprise (voir applyTheme) ===== */
    body { background: var(--appbg); }
    body.brand { background: var(--appbg); }
    .footer { background: transparent; color: rgba(255,255,255,.82); }
    .footer .version { color: rgba(255,255,255,.72); }
    h2 { color: #fff; }
    .tab { color: rgba(255,255,255,.85); }
    .tab.active { background: rgba(255,255,255,.96); color: #17304d; }
    .session-bar { color: rgba(255,255,255,.92); }
    .btn-filter { background: rgba(255,255,255,.95); border-color: rgba(255,255,255,.55); color: #17304d; }
    .btn-filter.active { background: rgba(255,255,255,.96); border-color: #fff; color: #17304d; }
    .btn-export, .btn-import { background: rgba(255,255,255,.92); }
    .sync-status { color: rgba(255,255,255,.9); }
    .btn-hint { color: rgba(255,255,255,.78); }
    body.brand .brandname { background: none; -webkit-text-fill-color: #fff; color: #fff; }
    body.brand .login-wrap p { color: rgba(255,255,255,.92); }
    body.brand .login-sep { color: rgba(255,255,255,.8); }
    body.brand .login-sep span { background: rgba(255,255,255,.4); }
    body.brand .login-btn { background: #fff; color: #17304d; }
  </style>
</head>

<script type="module">
// ===== Firebase =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
  getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink,
  onAuthStateChanged, signOut,
  GoogleAuthProvider, signInWithRedirect, signInWithPopup, getRedirectResult
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC-rw_ZqUS2_vq7Hn5GoxDY0liVle9wPBA",
  authDomain: "flashcards-italien-d4c89.firebaseapp.com",
  projectId: "flashcards-italien-d4c89",
  storageBucket: "flashcards-italien-d4c89.firebasestorage.app",
  messagingSenderId: "1029029907565",
  appId: "1:1029029907565:web:f5e71a62e52355b4248364"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const googleProvider = new GoogleAuthProvider();
// Toujours afficher le sélecteur de compte Google → permet de changer de compte
googleProvider.setCustomParameters({ prompt: "select_account" });

const APP_URL = window.location.origin + window.location.pathname;
const VERSION = "V7.05";

// Mode aperçu (test) : ?preview=itfr (italien), ?preview=frit (français), ?preview=pick (écran de choix)
// En aperçu, AUCUNE sauvegarde n'est faite : les données du compte ne sont jamais modifiées.
var PREVIEW = null;
try { PREVIEW = new URLSearchParams(window.location.search).get("preview"); } catch (e) {}

// ===== Langues (moteur multilingue) =====
// Chaque langue : drapeau, voix de synthèse, nom des langues DANS cette langue,
// exemples par défaut, et le thème appliqué quand on APPREND cette langue.
var LANGS = {
  fr: {
    flag: "🇫🇷", tts: "fr-FR",
    nameOf: { fr: "français", it: "italien" },
    sampleWord: "le vélo", sampleS1: "Je vais à l'école à vélo", sampleS2: "J'aime le vélo rouge",
    theme: { primary:"#0055A4", success:"#2e9e5b", danger:"#CE2B37", soft:"#eef4fb",
             bg:"#E7EEF4", footerText:"#9fb2c6", successRgb:"46,158,91", dangerRgb:"206,43,55" }
  },
  it: {
    flag: "🇮🇹", tts: "it-IT",
    nameOf: { fr: "francese", it: "italiano" },
    sampleWord: "la bicicletta", sampleS1: "Vado a scuola in bicicletta", sampleS2: "Mi piace la bicicletta rossa",
    theme: { primary:"#009246", success:"#009246", danger:"#CE2B37", soft:"#eef7f1",
             bg:"#E3EEEA", footerText:"#a1b3ad", successRgb:"0,146,70", dangerRgb:"206,43,55" }
  }
};

// Mode du compte : langue connue (interface + question) → langue apprise (audio + thème + réponse)
var MODE = { known: "fr", learn: "it" };   // défaut hérité (comptes existants = FR→IT)
var THEME = LANGS.it.theme;

function flagK(){ return LANGS[MODE.known].flag; }
function flagL(){ return LANGS[MODE.learn].flag; }
function learnName(){ return LANGS[MODE.known].nameOf[MODE.learn]; }
function knownName(){ return LANGS[MODE.known].nameOf[MODE.known]; }
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function appTitle(){ return flagL() + " Flashcards " + cap(learnName()); }

function applyTheme(){
  var th = LANGS[MODE.learn].theme;
  var r = document.documentElement.style;
  r.setProperty("--primary", th.primary);
  r.setProperty("--success", th.success);
  r.setProperty("--danger", th.danger);
  r.setProperty("--soft", th.soft);
  r.setProperty("--bg", th.bg);
  r.setProperty("--footer-text", th.footerText);
  // Fond par langue apprise : italien = plus de vert, français = un peu moins de vert
  r.setProperty("--appbg", MODE.learn === "it"
    ? "linear-gradient(135deg, #17a55a 0%, #17a55a 32%, #0a5fb8 100%)"
    : "linear-gradient(135deg, #17a55a 0%, #0a5fb8 100%)");
  THEME = th;
  document.documentElement.lang = MODE.known;
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", th.primary);
  if (PREVIEW) ensurePreviewBanner();
}

function ensurePreviewBanner() {
  if (!PREVIEW || document.getElementById("preview-banner")) return;
  var d = document.createElement("div");
  d.id = "preview-banner";
  d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:200;background:#17304d;color:#fff;font-size:12px;text-align:center;padding:6px 8px;font-weight:600";
  d.textContent = "👁️ Aperçu — rien n'est sauvegardé · Anteprima — niente viene salvato";
  document.body.appendChild(d);
  var root = document.getElementById("root");
  if (root) root.style.marginTop = "26px";
}

// ===== Traductions de l'interface =====
var UI = {
  fr: {
    tab_study:"Étudier", tab_add:"Ajouter", tab_cards:"Cartes",
    review_banner:"Révision des cartes archivées", review_quit:"Quitter",

    fl_all:"toutes les cartes", fl_today:"cartes du jour", fl_7d:"7 derniers jours", fl_30d:"30 derniers jours", fl_hard:"cartes difficiles",
    flmenu_all:"Toutes les cartes", flmenu_today:"Cartes du jour", flmenu_7d:"7 derniers jours", flmenu_30d:"30 derniers jours", flmenu_hard:"Cartes difficiles",
    flip_hint:"Cliquer pour retourner",
    btn_wrong:"✗ À revoir", btn_right:"✓ Je savais",
    long_press_hint:"Appui long sur un bouton pour plus d'options",
    empty_review:"Aucune carte archivée à réviser.", back_to_normal:"Retour au jeu normal",
    empty_filter:function(l){ return "Aucune carte pour ce filtre (" + l + ")."; }, see_all:"Voir toutes les cartes",
    empty_none:"Aucune carte disponible.",
    word_in:function(name){ return "Mot en " + name; },
    translation_in:function(name){ return "Traduction en " + name; },
    optional:"(facultatif)",
    ex1_label:"Phrase d'exemple 1", ex2_label:"Phrase d'exemple 2",
    add_btn:"Ajouter la carte",
    fill_both:"Remplis au moins le mot et sa traduction.",
    card_added:function(w){ return 'Carte "' + w + '" ajoutée !'; },
    sync_saving:"Sauvegarde...", sync_saved:"✓ Sauvegardé", sync_err:"⚠ Erreur de sauvegarde",
    search_ph:"🔍 Rechercher un mot...",
    exportt:"⬇ Exporter", importt:"⬆ Importer",
    cards_active:"Cartes en jeu", cards_archived:"Cartes archivées",
    hide:"Masquer ▲", show:"Afficher ▼",
    review_archived_btn:"▶ Réviser les cartes archivées",
    none_archived:"Aucune carte archivée", none_cards:"Aucune carte",
    connected:"Connecté : ", logout:"Déconnexion",
    options_title:"Options", edit_card:"✏️ Modifier la carte",
    archive_card:"Archiver la carte", reactivate_card:"Remettre la carte en jeu",
    delete_card:"Supprimer la carte", delete_card_deck:"Supprimer la carte du deck",
    cancel:"Annuler", save_btn:"Enregistrer",
    opts_card_title:"Options pour cette carte",
    reactivate_desc:"Remettre la carte en jeu : la carte quitte les archivées et redevient une carte de jeu normale.",
    answeropts_desc:"Mettre de côté : disparaît 1 mois puis revient.<br>Priorité maximale : apparaît 3× plus souvent 7 jours.<br>Archiver : place la carte dans les cartes archivées.",
    sideline_btn:"Mettre de côté 1 mois 💤", priority_btn:"Priorité maximale 7 jours 🔥",
    returning_title:"💤 Retour d'une carte",

    ok:"OK",
    filter_title:"Filtrer les cartes à réviser",

// Langue de l'interface avant connexion : celle du navigateur (it sinon fr)
var loginLang = ((navigator.language || "fr").toLowerCase().slice(0,2) === "it") ? "it" : "fr";
var uiLang = loginLang;
function t(k){
  var tbl = UI[uiLang] || UI.fr;
  var v = tbl[k];
  if (v === undefined) v = UI.fr[k];
  if (typeof v === "function") return v.apply(null, Array.prototype.slice.call(arguments, 1));
  return v;
}

// ===== Utilitaires =====
function cleanEmoji(val) {
  if (!val || val === "null" || val === "undefined") return null;
  return val;
}
function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escWrap(s) {
  return esc(s).replace(/\//g, "/<wbr>");
}
function stripAccent(s) {
  if (!s) return "";
  return String(s).replace(/\*/g, "");
}
function renderAccent(s) {
  if (!s) return "";
  var parts = String(s).split("*");
  var out = "";
  for (var i = 0; i < parts.length; i++) {
    var seg = esc(parts[i]).replace(/\//g, "/<wbr>");
    if (i % 2 === 1) { out += "<u>" + seg + "</u>"; }
    else { out += seg; }
  }
  return out;
}

var INITIAL_CARDS = [
  { id: 1, fr: "le chat", it: "il gatto", emoji: "🐱" },
  { id: 2, fr: "le chien", it: "il cane", emoji: "🐶" },
  { id: 3, fr: "la maison", it: "la casa", emoji: "🏠" },
  { id: 4, fr: "le livre", it: "il libro", emoji: "📚" },
  { id: 5, fr: "la pomme", it: "la mela", emoji: "🍎" }
];

function normalizeCard(c) {
  var emoji = (c.id >= 1 && c.id <= 5) ? cleanEmoji(c.emoji) : null;
  return {
    id: c.id, fr: c.fr, it: c.it, emoji: emoji,
    example: c.example || null, example2: c.example2 || null,
    archived: c.archived === true,
    createdAt: (typeof c.createdAt === "number") ? c.createdAt : null
  };
}

function todayKey() {
  var d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

try { dailyStats = JSON.parse(localStorage.getItem("fc_daily") || "null"); } catch (err) { dailyStats = null; }

    typeof dailyStats.studyRight !== "number" || typeof dailyStats.reviewRight !== "number") {
  dailyStats = { date: todayKey(), studyRight: 0, studyWrong: 0, reviewRight: 0, reviewWrong: 0 };
  localStorage.setItem("fc_daily", JSON.stringify(dailyStats));
}

// ===== Sauvegarde locale (cache) + cloud =====
function localKey() { return currentUser ? "fc_cards_" + currentUser.uid : "fc_cards"; }
function localScoresKey() { return currentUser ? "fc_scores_" + currentUser.uid : "fc_scores"; }

function saveLocal() {
  if (PREVIEW) return;
  localStorage.setItem(localKey(), JSON.stringify(cards));
  localStorage.setItem(localScoresKey(), JSON.stringify(scores));
}

var saveTimeout = null;
function save() {
  if (PREVIEW) return;
  saveLocal();
  if (currentUser) {
    syncState = t("sync_saving");
    updateSyncStatus();
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveToCloud, 800);
  }
}

async function saveToCloud() {
  if (!currentUser || PREVIEW) return;
  try {
    await setDoc(doc(db, "users", currentUser.uid), {
      cards: cards, scores: scores, mode: MODE, updated: Date.now()
    });
    syncState = t("sync_saved");
    updateSyncStatus();
    setTimeout(function(){ syncState = ""; updateSyncStatus(); }, 2000);
  } catch (err) {
    syncState = t("sync_err");
    updateSyncStatus();
  }
}

// Charge le compte. Retourne { needsPicker:true } si c'est un nouveau compte
// sans cartes ni mode (→ écran de choix de langue).
async function loadFromCloud() {
  if (!currentUser) return { needsPicker:false };
  try {
    var snap = await getDoc(doc(db, "users", currentUser.uid));
    if (snap.exists()) {
      var data = snap.data();
      if (data.cards && Array.isArray(data.cards)) {
        cards = data.cards.map(normalizeCard);
        scores = data.scores || {};
      } else {
        cards = INITIAL_CARDS.map(normalizeCard); scores = {};
      }
      MODE = (data.mode && data.mode.known && data.mode.learn)
        ? { known: data.mode.known, learn: data.mode.learn }
        : { known: "fr", learn: "it" };   // comptes existants = FR→IT
      nextId = cards.length ? Math.max.apply(null, cards.map(function(c){ return c.id; })) + 1 : 1;
      saveLocal();
      return { needsPicker:false };
    } else {
      // Nouveau compte (aucun document cloud) → écran de choix de la langue.
      // (Plus de migration automatique depuis le cache local : elle faisait hériter
      //  les cartes d'un autre compte présent sur l'appareil et sautait l'écran de choix.)
      return { needsPicker:true };
    }
  } catch (err) {
    // Hors-ligne : on retombe sur le cache local, en supposant FR→IT.
    var lr = null;
    try { lr = JSON.parse(localStorage.getItem(localKey()) || "null"); } catch (e) {}
    cards = (lr && Array.isArray(lr)) ? lr.map(normalizeCard) : INITIAL_CARDS.map(normalizeCard);
    try { scores = JSON.parse(localStorage.getItem(localScoresKey()) || "{}"); } catch (e) { scores = {}; }
    MODE = { known: "fr", learn: "it" };
    nextId = cards.length ? Math.max.apply(null, cards.map(function(c){ return c.id; })) + 1 : 1;
    return { needsPicker:false };
  }
}

function updateSyncStatus() {
  var el = document.getElementById("sync-status");
  if (el) el.textContent = syncState;
}

// ===== Deck =====
function isCardActive(c) {
  if (c.archived) return false;
  var s = scores[c.id];
  if (!s) return true;
  if (s.sidelined && Date.now() < s.sidelined) return false;
  return true;
}
function isReturningCard(c) {
  var s = scores[c.id];
  return !!(s && s.sidelined && Date.now() >= s.sidelined);
}
function startOfDayOffset(daysBack) {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - daysBack);
  return d.getTime();
}
function isHardCard(c) {
  var s = scores[c.id];
  if (!s || !s.history) return false;
  var hist = s.history.slice(-5);
  var reds = 0;
  for (var i = 0; i < hist.length; i++) if (!hist[i]) reds++;
  return reds >= 2;
}
function matchesFilter(c, f) {
  if (f === "hard") return isHardCard(c);
  if (f === "today") return !!c.createdAt && c.createdAt >= startOfDayOffset(0);
  if (f === "7d") return !!c.createdAt && c.createdAt >= startOfDayOffset(6);
  if (f === "30d") return !!c.createdAt && c.createdAt >= startOfDayOffset(29);
  return true;
}
function filterLabel(f) {
  if (f === "today") return t("fl_today");
  if (f === "7d") return t("fl_7d");
  if (f === "30d") return t("fl_30d");
  if (f === "hard") return t("fl_hard");
  return t("fl_all");
}

function buildDeck() {
  var pool = cards.filter(function(c){ return reviewMode ? c.archived : isCardActive(c); });
  var filterActive = (!reviewMode && studyFilter !== "all");
  if (filterActive) {
    pool = pool.filter(function(c){ return matchesFilter(c, studyFilter); });
  }
  var n = pool.length;
  var d = [];
  pool.forEach(function(c, i) {
    var w;
    if (filterActive) {
      w = 1;
    } else {
      var s = scores[c.id] || { right: 0, wrong: 0 };
      w = Math.max(1, 1 + (s.wrong || 0) * 2 - (s.right || 0));
      if (!reviewMode && s.priority && Date.now() < s.priority) w *= 3;
      if (!reviewMode) {
        var rank = n - i;
        if (rank <= 10) w *= 3;
        else if (rank <= 30) w *= 2;
      }
    }
    for (var j = 0; j < w; j++) d.push(Object.assign({}, c, { reversed: Math.random() < 0.2 }));
  });
  for (var i2 = d.length - 1; i2 > 0; i2--) {
    var j2 = Math.floor(Math.random() * (i2 + 1));
    var tmp = d[i2]; d[i2] = d[j2]; d[j2] = tmp;
  }
  deck = d; idx = 0; flipped = false;
}

function buildListHtml(archived) {
  var list = cards.filter(function(c){ return archived ? c.archived : !c.archived; });
  list = list.slice().sort(function(a, b){ return b.id - a.id; });
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    list = list.filter(function(c) {
      return String(c[MODE.known]).toLowerCase().indexOf(q) !== -1 || stripAccent(c[MODE.learn]).toLowerCase().indexOf(q) !== -1;
    });
  }
  var html = "";
  list.forEach(function(c) {
    var s = scores[c.id] || {};
    var hist = (s.history || []).slice(-5);
    var dotsHtml = "";
    for (var di = 0; di < 5; di++) {
      var col = di < hist.length ? (hist[di] ? "var(--success)" : "var(--danger)") : "#ddd";
      dotsHtml += "<span style='display:inline-block;width:11px;height:11px;border-radius:50%;background:" + col + ";margin-left:3px'></span>";
    }
    var isSidelined = s.sidelined && Date.now() < s.sidelined;
    var isPriority = s.priority && Date.now() < s.priority;
    var badge = archived ? "" : (isSidelined ? " 💤" : (isPriority ? " 🔥" : ""));

    html += "<div class='stat-row'>";
    html += "<span class='stat-row-word' onmousedown='startPress(" + c.id + ")' onmouseup='cancelPress()' onmouseleave='cancelPress()' ontouchstart='startPress(" + c.id + ")' ontouchend='cancelPress()' ontouchcancel='cancelPress()'>" + esc(c[MODE.known]) + " → " + esc(stripAccent(c[MODE.learn])) + badge + "</span>";
    html += "<span style='white-space:nowrap'>" + dotsHtml + "</span>";
    html += "<button class='row-plus' onclick='openRowMenu(" + c.id + "," + (archived ? "true" : "false") + ")'>+</button>";
    html += "</div>";
  });
  if (list.length === 0) html += "<p style='text-align:center;color:#aaa;font-size:14px;padding:1rem 0'>" + (archived ? t("none_archived") : t("none_cards")) + "</p>";
  return html;
}

function flashBtn(id, correct) {

  clearTimeout(btnPressTimer);
  btnPressTimer = null;
  var btn = document.getElementById(id);
  var cardInner = document.querySelector(".card-inner");

  var rgb = correct ? THEME.successRgb : THEME.dangerRgb;
  if (btn) btn.classList.add("flash");

    cardInner.style.borderRadius = "16px";

function answer(correct) {
  var card = deck[idx];
  if (!card) return;
  lastCardId = card.id;
  var prev = scores[card.id] || { right: 0, wrong: 0, history: [] };
  var history = (prev.history || []).concat([correct]).slice(-10);
  scores[card.id] = Object.assign({}, prev, {
    right: correct ? (prev.right || 0) + 1 : (prev.right || 0),
    wrong: !correct ? (prev.wrong || 0) + 1 : (prev.wrong || 0),
    history: history
  });
  if (reviewMode) {
    if (correct) dailyStats.reviewRight++; else dailyStats.reviewWrong++;
  } else {
    if (correct) dailyStats.studyRight++; else dailyStats.studyWrong++;
  }
  saveDaily();
  save();
  buildDeck();
  var pool = Math.min(deck.length, 5);
  var candidates = [];
  for (var ci = 0; ci < pool; ci++) if (deck[ci].id !== lastCardId) candidates.push(ci);
  if (candidates.length === 0) {
    for (var cj = 0; cj < deck.length; cj++) if (deck[cj].id !== lastCardId) candidates.push(cj);
  }
  idx = candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : 0;
  flipped = false;
  render();
}

  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (data.cards && Array.isArray(data.cards)) {
        cards = data.cards.map(normalizeCard);
        scores = data.scores || {};
        nextId = cards.length ? Math.max.apply(null, cards.map(function(c){ return c.id; })) + 1 : 1;
        save(); buildDeck(); render();
        alert(t("import_success", cards.length));
      } else { alert(t("import_invalid")); }
    } catch (err) { alert(t("import_error")); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

// ===== Prononciation audio (voix de la langue apprise) =====
function cleanForSpeech(s) {
  return String(s || "")
    .replace(/\*/g, "")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\u{FE00}-\u{FE0F}\u{200D}]/gu, "")
    .replace(/\s*\/\s*/g, ", ")
    .replace(/\s+/g, " ")
    .trim();
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  if (!text) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = LANGS[MODE.learn].tts;
    var pref = MODE.learn;
    var voices = window.speechSynthesis.getVoices() || [];
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.toLowerCase().indexOf(pref) === 0) { u.voice = voices[i]; break; }
    }
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function speakWord(id) {
  var c = cards.find(function(x){ return x.id === id; });
  if (!c) return;
  speak(cleanForSpeech(c[MODE.learn]));
}
function speakExample(id, which) {
  var c = cards.find(function(x){ return x.id === id; });
  if (!c) return;
  speak(cleanForSpeech(which === 2 ? c.example2 : c.example));
}

// ===== Pop-up "Nouveautés" (uniquement pour les comptes FR→IT existants) =====
var whatsNewShown = false;
function maybeShowWhatsNew() {
  if (MODE.known !== "fr" || MODE.learn !== "it") return;
  if (whatsNewShown) return;
  var seen = false;
  try { seen = localStorage.getItem("fc_whatsnew_v6") === "1"; } catch (e) {}
  if (seen) return;
  if (cards.length === 5) return;
  whatsNewShown = true;
  showWhatsNew();
}
function showWhatsNew() {
  document.getElementById("modal-container").innerHTML =
    "<div class='modal-overlay'><div class='modal'>" +
    "<h3>✨ Nouveautés</h3>" +
    "<div style='font-size:15px;color:#333;line-height:1.55'>" +
    "<p style='margin-bottom:12px'>L'appli s'est enrichie de deux fonctionnalités :</p>" +
    "<p style='margin-bottom:10px'><b>🔎 Filtrer</b> — un bouton sous ton score (onglet Étudier) te permet de réviser seulement certaines cartes : celles du jour, des 7 ou 30 derniers jours, ou les cartes difficiles.</p>" +
    "<p style='background:#f3ecdd;color:#7a5c1a;border-radius:10px;padding:10px 12px;margin-bottom:12px'>⚠️ Les filtres par date (jour / 7 j / 30 j) ne concernent que les cartes ajoutées à partir de maintenant : les cartes plus anciennes n'ont pas de date d'ajout enregistrée.</p>" +
    "<p style='margin-bottom:12px'><b>🔊 Audio</b> — au dos de chaque carte, un bouton haut-parleur prononce le mot italien à voix haute.</p>" +
    "</div>" +
    "<button class='btn-save' style='width:100%;margin-top:16px' onclick='dismissWhatsNew()'>J'ai compris</button>" +
    "</div></div>";
}
function dismissWhatsNew() {
  try { localStorage.setItem("fc_whatsnew_v6", "1"); } catch (e) {}
  closeModal();
}

async function loginWithGoogle() {
  var btn = document.getElementById("btn-google");
  var msg = document.getElementById("login-msg");
  if (btn) { btn.disabled = true; }
  try {
    await signInWithPopup(auth, googleProvider);
  } catch (err) {
    var code = err && err.code ? err.code : "";
    if (code === "auth/popup-blocked" ||
        code === "auth/operation-not-supported-in-this-environment" ||
        code === "auth/cancelled-popup-request") {
      try { await signInWithRedirect(auth, googleProvider); return; } catch (e2) {}
    }
    if (btn) { btn.disabled = false; }
    if (msg) {
      msg.className = "login-msg err";
      if (code === "auth/popup-closed-by-user") {
        msg.textContent = t("login_google_cancel");
      } else {
        msg.textContent = t("login_google_err", (err && err.message ? err.message : t("login_google_retry")));
      }
    }
  }
}

async function sendLoginLink() {
  var emailEl = document.getElementById("login-email");
  var btn = document.getElementById("login-btn");
  var msg = document.getElementById("login-msg");
  var email = emailEl.value.trim();
  if (!email || email.indexOf("@") === -1) { msg.className = "login-msg err"; msg.textContent = t("login_email_invalid"); return; }
  if (/@(gmail\.com|googlemail\.com)$/i.test(email)) {
    msg.className = "login-msg";
    msg.style.color = "#9a7524";
    msg.innerHTML = t("login_gmail_redirect");
    return;
  }
  btn.disabled = true; btn.textContent = t("login_sending");
  var actionCodeSettings = { url: APP_URL, handleCodeInApp: true };
  try {
    await sendSignInLinkToEmail(auth, email, actionCodeSettings);
    window.localStorage.setItem("fc_emailForSignIn", email);
    msg.className = "login-msg ok";
    msg.innerHTML = t("login_link_sent", esc(email));
  } catch (err) {
    msg.className = "login-msg err";
    if (err && err.code === "auth/quota-exceeded") {
      msg.innerHTML = t("login_quota");
    } else {
      msg.textContent = t("login_error", (err && err.message ? err.message : t("login_cannot_send")));
    }
    btn.disabled = false; btn.textContent = t("login_send");
  }
}

async function doLogout() {
  if (!confirm(t("logout_confirm"))) return;
  try { await signOut(auth); } catch (e) {}
  window.location.reload();
}

async function completeEmailLinkSignIn() {
  if (isSignInWithEmailLink(auth, window.location.href)) {
    var email = window.localStorage.getItem("fc_emailForSignIn");
    if (!email) {
      email = window.prompt(t("confirm_email_prompt"));
    }
    if (email) {
      try {
        await signInWithEmailLink(auth, email, window.location.href);
        window.localStorage.removeItem("fc_emailForSignIn");
        window.history.replaceState({}, document.title, APP_URL);
      } catch (err) {
        renderLogin(t("login_link_expired"), "err");
        return;
      }
    }
  }
}

async function completeGoogleRedirect() {
  try {
    await getRedirectResult(auth);
  } catch (err) {}
}

onAuthStateChanged(auth, async function(user) {
  if (user) {
    currentUser = user;
    renderLoadingState();
    var res = await loadFromCloud();
    // Aperçu de l'écran de choix
    if (PREVIEW === "pick") { renderPicker(); return; }
    if (res && res.needsPicker) {
      if (PREVIEW) { cards = INITIAL_CARDS.map(normalizeCard); scores = {}; nextId = 6; }
      else { renderPicker(); return; }
    }
    // Aperçu : on force le sens demandé, sans rien sauvegarder
    if (PREVIEW === "itfr") MODE = { known: "it", learn: "fr" };
    else if (PREVIEW === "frit") MODE = { known: "fr", learn: "it" };
    uiLang = MODE.known;
    applyTheme();
    buildDeck();
    render();
    if (!PREVIEW) maybeShowWhatsNew();
  } else {
    currentUser = null;
    uiLang = loginLang;
    renderLogin();
  }
});

function renderLoadingState() {
  document.body.className = "brand";
  uiLang = loginLang;
  var root = document.getElementById("root");
  root.innerHTML = "<div class='login-wrap'><h1><span class='brandname'>Flashcards</span> 🇮🇹🇫🇷</h1><p>" + t("loading") + "</p></div>";
  setFooter();
}
