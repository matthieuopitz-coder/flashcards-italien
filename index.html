<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards Italien</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#009246" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Flashcards IT" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f0; min-height: 100vh; touch-action: manipulation; }
    body.review-mode { background: #f3ecdd; }
    #root { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem 3rem 1rem; }
    h2 { text-align: center; font-size: 22px; font-weight: 500; margin-bottom: 20px; }
    .tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 24px; }
    .tab { padding: 9px 20px; border-radius: 20px; border: none; cursor: pointer; font-size: 16px; font-weight: 500; background: transparent; color: #555; transition: all 0.2s; }
    .tab.active { background: #009246; color: #fff; }
    .session-bar { display: flex; justify-content: space-between; font-size: 15px; color: #888; margin-bottom: 12px; }

    .card-wrap { perspective: 1000px; cursor: pointer; height: 298px; margin-bottom: 20px; }
    .card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.5s; border-radius: 16px; }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 1.2rem;
      background: #fff; border: 2.5px solid #ddd;
    }
    body.review-mode .card-face { border-color: #C79A3B; }
    .card-back { transform: rotateY(180deg); }
    .card-emoji { font-size: 56px; }
    .card-word { font-size: 30px; font-weight: 600; text-align: center; overflow-wrap: break-word; max-width: 100%; line-height: 1.2; }
    .card-sub { font-size: 20px; font-weight: 400; text-align: center; color: #555; overflow-wrap: break-word; max-width: 100%; line-height: 1.2; }
    .card-example { font-size: 16px; font-style: italic; text-align: center; color: #777; overflow-wrap: break-word; max-width: 100%; line-height: 1.3; }
    .card-example.first { margin-top: 6px; }
    .card-example.second { margin-top: -6px; }
    .card-lang { font-size: 26px; letter-spacing: 4px; }
    .card-hint { font-size: 13px; color: #bbb; margin-top: 2px; }

    .review-banner { text-align: center; background: #e8dab5; color: #7a5c1a; font-size: 16px; font-weight: 500; padding: 8px 12px; border-radius: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .review-banner button { background: none; border: none; color: #7a5c1a; font-size: 16px; cursor: pointer; text-decoration: underline; }

    .answer-btns { display: flex; gap: 12px; margin-bottom: 6px; }
    .btn-wrong { flex: 1; padding: 14px 0; border-radius: 12px; border: 1.5px solid #CE2B37; background: transparent; color: #CE2B37; font-size: 19px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s; user-select: none; -webkit-user-select: none; }
    .btn-wrong.flash { background: #CE2B37; color: #fff; }
    .btn-right { flex: 1; padding: 14px 0; border-radius: 12px; border: 1.5px solid #009246; background: transparent; color: #009246; font-size: 19px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s; user-select: none; -webkit-user-select: none; }
    .btn-right.flash { background: #009246; color: #fff; }
    .btn-hint { text-align: center; font-size: 12px; color: #a0a0a0; margin-top: 2px; }

    .form-card { background: #fff; border: 1px solid #ccc; border-radius: 16px; padding: 1.5rem; margin-bottom: 16px; }
    .form-label { font-size: 16px; color: #444; font-weight: 600; display: block; margin-bottom: 4px; }
    .form-input { width: 100%; padding: 11px 13px; border: 0.5px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 14px; outline: none; background: #f7f7f4; }
    .form-input:focus { border-color: #009246; background: #fff; }
    .btn-add { width: 100%; padding: 14px 0; border-radius: 12px; border: none; background: #009246; color: #fff; font-size: 17px; font-weight: 500; cursor: pointer; }
    .add-msg { margin-top: 12px; text-align: center; font-size: 15px; }
    .add-msg.ok { color: #009246; }
    .add-msg.err { color: #CE2B37; }

    .deck-top { display: flex; gap: 10px; margin-bottom: 16px; }
    .search-box { flex: 1; padding: 8px 13px; border: 0.5px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; background: #fff; }
    .search-box:focus { border-color: #009246; }
    .export-btns { display: flex; gap: 10px; margin-bottom: 16px; }
    .btn-export { flex: 1; padding: 12px 0; border-radius: 12px; border: 1.5px solid #009246; background: transparent; color: #009246; font-size: 15px; font-weight: 500; cursor: pointer; }
    .btn-import { flex: 1; padding: 12px 0; border-radius: 12px; border: 1.5px solid #888; background: transparent; color: #888; font-size: 15px; font-weight: 500; cursor: pointer; }

    .list-block { background: #fff; border: 1px solid #999; border-radius: 16px; padding: 1rem 1.25rem; margin-bottom: 16px; }
    .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .list-title { font-size: 17px; font-weight: 600; }
    .list-title .count { color: #009246; font-weight: 600; }
    .list-scroll { max-height: 320px; overflow-y: auto; }
    .collapse-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: #888; display: flex; align-items: center; gap: 6px; }
    .stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 15px; user-select: none; }
    .stat-row-word { flex: 1; cursor: pointer; padding: 2px 4px; border-radius: 6px; transition: background 0.2s; }
    .stat-row-word:active { background: #f0f0e8; }
    .mastered-block { background: #f3ecdd; border-color: #b09660; }
    .btn-review-mastered { width: 100%; padding: 11px 0; border-radius: 12px; border: 1.5px solid #C79A3B; background: transparent; color: #9a7524; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 12px; }
    .row-plus { background: #f0f0eb; border: 1px solid #bbb; border-radius: 7px; cursor: pointer; font-size: 19px; width: 27px; height: 27px; padding: 0; color: #666; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .footer { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; font-size: 11px; color: #c4c4c4; padding: 6px 0 8px; background: #f5f5f0; }
    body.review-mode .footer { background: #f3ecdd; }
    .footer .version { color: #bbb; margin-left: 6px; }
    .sync-status { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 10px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal { background: #fff; border: 1px solid #ccc; border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 420px; position: relative; }
    .modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; padding-right: 30px; }
    .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 22px; color: #aaa; cursor: pointer; line-height: 1; }
    .modal-desc { font-size: 13px; color: #aaa; margin-bottom: 16px; line-height: 1.4; }
    .modal-option { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1.5px solid #ddd; background: transparent; color: #222; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; text-align: left; transition: background 0.15s, color 0.15s; }
    .modal-option:hover { background: #f5f5f0; }
    .modal-option.danger { color: #CE2B37; border-color: #CE2B37; }
    .modal-option.sideline { border-color: #2B7FCE; color: #2B7FCE; }
    .modal-option.priority { border-color: #E08A1E; color: #E08A1E; }
    .modal-option.archive { border-color: #C79A3B; color: #9a7524; }
    .modal-option.reactivate { border-color: #009246; color: #009246; }
    .modal-option.flash-blue { background: #2B7FCE; color: #fff; }
    .modal-option.flash-orange { background: #E08A1E; color: #fff; }
    .modal-option.flash-gold { background: #C79A3B; color: #fff; }
    .modal-option.flash-green { background: #009246; color: #fff; }
    .modal-option.flash-red { background: #CE2B37; color: #fff; }
    .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
    .btn-cancel { flex: 1; padding: 12px 0; border-radius: 12px; border: 1.5px solid #ddd; background: transparent; color: #888; font-size: 15px; cursor: pointer; }
    .btn-save { flex: 1; padding: 12px 0; border-radius: 12px; border: none; background: #009246; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; }

    /* Écran de connexion */
    .login-wrap { max-width: 420px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; }
    .login-wrap h1 { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
    .login-wrap p { font-size: 15px; color: #666; line-height: 1.5; margin-bottom: 24px; }
    .login-input { width: 100%; padding: 13px 15px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; margin-bottom: 14px; outline: none; }
    .login-input:focus { border-color: #009246; }
    .login-btn { width: 100%; padding: 14px 0; border-radius: 12px; border: none; background: #009246; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    .login-btn:disabled { opacity: 0.6; cursor: wait; }
    .login-msg { margin-top: 16px; font-size: 14px; line-height: 1.5; }
    .login-msg.ok { color: #009246; }
    .login-msg.err { color: #CE2B37; }
    .logout-link { background: none; border: none; color: #aaa; font-size: 13px; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
<div id="root"></div>
<div id="modal-container"></div>
<div class="footer">Application développée par Matthieu Opitz<span class="version">V3.13</span></div>
<input type="file" id="import-input" accept=".json" style="display:none" />

<script type="module">
// ===== Firebase =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
  getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC-rw_ZqUS2_vq7Hn5GoxDY0liVle9wPBA",
  authDomain: "flashcards-italien-d4c89.firebaseapp.com",
  projectId: "flashcards-italien-d4c89",
  storageBucket: "flashcards-italien-d4c89.firebasestorage.app",
  messagingSenderId: "1029029907565",
  appId: "1:1029029907565:web:f5e71a62e52355b4248364"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const APP_URL = window.location.origin + window.location.pathname;

// ===== Utilitaires =====
function cleanEmoji(val) {
  if (!val || val === "null" || val === "undefined") return null;
  return val;
}
function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escWrap(s) {
  return esc(s).replace(/\//g, "/<wbr>");
}
function stripAccent(s) {
  if (!s) return "";
  return String(s).replace(/\*/g, "");
}
function renderAccent(s) {
  if (!s) return "";
  var e = esc(s);
  var toggle = 0;
  e = e.replace(/\*/g, function() {
    toggle = 1 - toggle;
    return toggle === 1 ? "<u>" : "</u>";
  });
  if (toggle === 1) e += "</u>";
  return e.replace(/\//g, "/<wbr>");
}

var INITIAL_CARDS = [
  { id: 1, fr: "le chat", it: "il gatto", emoji: "🐱" },
  { id: 2, fr: "le chien", it: "il cane", emoji: "🐶" },
  { id: 3, fr: "la maison", it: "la casa", emoji: "🏠" },
  { id: 4, fr: "le livre", it: "il libro", emoji: "📚" },
  { id: 5, fr: "la pomme", it: "la mela", emoji: "🍎" }
];

function normalizeCard(c) {
  var emoji = (c.id >= 1 && c.id <= 5) ? cleanEmoji(c.emoji) : null;
  return {
    id: c.id, fr: c.fr, it: c.it, emoji: emoji,
    example: c.example || null, example2: c.example2 || null,
    archived: c.archived === true
  };
}

// ===== État global =====
var cards = [];
var scores = {};
var nextId = 1;
var deck = [], idx = 0, flipped = false;
var view = "study";
var pressTimer = null;
var btnPressTimer = null;
var lastCardId = null;
var searchQuery = "";
var masteredOpen = false;
var reviewMode = false;
var currentUser = null;
var syncState = "";

// ===== Compteurs journaliers =====
function todayKey() {
  var d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
var dailyStats = null;
try { dailyStats = JSON.parse(localStorage.getItem("fc_daily") || "null"); } catch (err) { dailyStats = null; }
if (!dailyStats || dailyStats.date !== todayKey() ||
    typeof dailyStats.studyRight !== "number" || typeof dailyStats.reviewRight !== "number") {
  dailyStats = { date: todayKey(), studyRight: 0, studyWrong: 0, reviewRight: 0, reviewWrong: 0 };
  localStorage.setItem("fc_daily", JSON.stringify(dailyStats));
}
function saveDaily() { localStorage.setItem("fc_daily", JSON.stringify(dailyStats)); }

// ===== Sauvegarde locale (cache) + cloud =====
function localKey() { return currentUser ? "fc_cards_" + currentUser.uid : "fc_cards"; }
function localScoresKey() { return currentUser ? "fc_scores_" + currentUser.uid : "fc_scores"; }

function saveLocal() {
  localStorage.setItem(localKey(), JSON.stringify(cards));
  localStorage.setItem(localScoresKey(), JSON.stringify(scores));
}

var saveTimeout = null;
function save() {
  saveLocal();
  // Sauvegarde cloud différée (évite trop d'écritures rapprochées)
  if (currentUser) {
    syncState = "Sauvegarde...";
    updateSyncStatus();
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveToCloud, 800);
  }
}

async function saveToCloud() {
  if (!currentUser) return;
  try {
    await setDoc(doc(db, "users", currentUser.uid), {
      cards: cards, scores: scores, updated: Date.now()
    });
    syncState = "✓ Sauvegardé";
    updateSyncStatus();
    setTimeout(function(){ syncState = ""; updateSyncStatus(); }, 2000);
  } catch (err) {
    syncState = "⚠ Erreur de sauvegarde";
    updateSyncStatus();
  }
}

async function loadFromCloud() {
  if (!currentUser) return;
  try {
    var snap = await getDoc(doc(db, "users", currentUser.uid));
    if (snap.exists()) {
      var data = snap.data();
      if (data.cards && Array.isArray(data.cards)) {
        cards = data.cards.map(normalizeCard);
        scores = data.scores || {};
      } else {
        cards = INITIAL_CARDS.map(normalizeCard); scores = {};
      }
    } else {
      // Nouveau compte : on tente de récupérer un éventuel cache local, sinon cartes de base
      var localRaw = null;
      try { localRaw = JSON.parse(localStorage.getItem(localKey()) || "null"); } catch (e) {}
      if (localRaw && Array.isArray(localRaw) && localRaw.length > 0) {
        cards = localRaw.map(normalizeCard);
        try { scores = JSON.parse(localStorage.getItem(localScoresKey()) || "{}"); } catch (e) { scores = {}; }
      } else {
        cards = INITIAL_CARDS.map(normalizeCard); scores = {};
      }
      await saveToCloud();
    }
    nextId = cards.length ? Math.max.apply(null, cards.map(function(c){ return c.id; })) + 1 : 1;
    saveLocal();
  } catch (err) {
    // En cas d'erreur réseau, on charge le cache local
    var lr = null;
    try { lr = JSON.parse(localStorage.getItem(localKey()) || "null"); } catch (e) {}
    cards = (lr && Array.isArray(lr)) ? lr.map(normalizeCard) : INITIAL_CARDS.map(normalizeCard);
    try { scores = JSON.parse(localStorage.getItem(localScoresKey()) || "{}"); } catch (e) { scores = {}; }
    nextId = cards.length ? Math.max.apply(null, cards.map(function(c){ return c.id; })) + 1 : 1;
  }
}

function updateSyncStatus() {
  var el = document.getElementById("sync-status");
  if (el) el.textContent = syncState;
}

// ===== Deck =====
function isCardActive(c) {
  if (c.archived) return false;
  var s = scores[c.id];
  if (!s) return true;
  if (s.sidelined && Date.now() < s.sidelined) return false;
  return true;
}
function isReturningCard(c) {
  var s = scores[c.id];
  return !!(s && s.sidelined && Date.now() >= s.sidelined);
}
function buildDeck() {
  var pool = cards.filter(function(c){ return reviewMode ? c.archived : isCardActive(c); });
  var n = pool.length;
  var d = [];
  pool.forEach(function(c, i) {
    var s = scores[c.id] || { right: 0, wrong: 0 };
    var w = Math.max(1, 1 + (s.wrong || 0) * 2 - (s.right || 0));
    if (!reviewMode && s.priority && Date.now() < s.priority) w *= 3;
    if (!reviewMode) {
      var rank = n - i;
      if (rank <= 10) w *= 3;
      else if (rank <= 30) w *= 2;
    }
    for (var j = 0; j < w; j++) d.push(Object.assign({}, c, { reversed: Math.random() < 0.2 }));
  });
  for (var i2 = d.length - 1; i2 > 0; i2--) {
    var j2 = Math.floor(Math.random() * (i2 + 1));
    var tmp = d[i2]; d[i2] = d[j2]; d[j2] = tmp;
  }
  deck = d; idx = 0; flipped = false;
}

// ===== Rendu principal =====
function render() {
  var savedScroll = {};
  var al = document.getElementById("active-list");
  var ml = document.getElementById("mastered-list");
  if (al) savedScroll.active = al.scrollTop;
  if (ml) savedScroll.mastered = ml.scrollTop;

  var root = document.getElementById("root");
  document.body.className = (view === "study" && reviewMode) ? "review-mode" : "";

  var right = reviewMode ? dailyStats.reviewRight : dailyStats.studyRight;
  var wrong = reviewMode ? dailyStats.reviewWrong : dailyStats.studyWrong;
  var total = right + wrong;
  var pct = total ? Math.round(right / total * 100) : null;
  var card = deck[idx];

  var html = "";
  html += "<h2>🇮🇹 Flashcards Italien</h2>";
  html += "<div class='tabs'>";
  html += "<button class='tab " + (view==="study"?"active":"") + "' onclick=\"setView('study')\">Étudier</button>";
  html += "<button class='tab " + (view==="add"?"active":"") + "' onclick=\"setView('add')\">Ajouter</button>";
  html += "<button class='tab " + (view==="stats"?"active":"") + "' onclick=\"setView('stats')\">Cartes</button>";
  html += "</div>";

  if (view === "study") {
    if (reviewMode) {
      html += "<div class='review-banner'><span>Révision des cartes archivées</span><button onclick='exitReview()'>Quitter</button></div>";
    }
    html += "<div class='session-bar'>";
    html += "<span>Jour : " + total + " cartes</span>";
    html += "<span style='color:" + (pct===null?"#888":(pct>=70?"#009246":"#CE2B37")) + "'>" + (pct===null?"Commence !":pct+"% réussi") + "</span>";
    html += "</div>";

    if (card) {
      var frText = escWrap(card.fr);
      var itText = renderAccent(card.it);
      var front = card.reversed ? itText : frText;
      var back  = card.reversed ? frText : itText;
      var lang  = card.reversed ? "🇮🇹 → 🇫🇷" : "🇫🇷 → 🇮🇹";
      var e = card.emoji;

      html += "<div class='card-wrap' onclick='flipCard()'>";
      html += "<div class='card-inner " + (flipped?"flipped":"") + "'>";
      html += "<div class='card-face card-front'>";
      if (e) html += "<div class='card-emoji'>" + e + "</div>";
      html += "<div class='card-word'>" + front + "</div>";
      html += "<div class='card-lang'>" + lang + "</div>";
      html += "<div class='card-hint'>Cliquer pour retourner</div>";
      html += "</div>";
      html += "<div class='card-face card-back'>";
      if (e) html += "<div class='card-emoji'>" + e + "</div>";
      html += "<div class='card-word'>" + back + "</div>";
      html += "<div class='card-sub'>" + front + "</div>";
      if (card.example) html += "<div class='card-example first'>« " + esc(card.example) + " »</div>";
      if (card.example2) html += "<div class='card-example second'>« " + esc(card.example2) + " »</div>";
      html += "</div>";
      html += "</div>";
      html += "</div>";

      html += "<div id='answer-btns' class='answer-btns' style='display:" + (flipped?"flex":"none") + "'>";
      html += "<button class='btn-wrong' id='btn-wrong' onclick=\"flashBtn('btn-wrong', false)\" onmousedown='startBtnPress()' onmouseup='cancelBtnPress()' onmouseleave='cancelBtnPress()' ontouchstart='startBtnPress()' ontouchend='cancelBtnPress()' ontouchcancel='cancelBtnPress()'>✗ À revoir</button>";
      html += "<button class='btn-right' id='btn-right' onclick=\"flashBtn('btn-right', true)\" onmousedown='startBtnPress()' onmouseup='cancelBtnPress()' onmouseleave='cancelBtnPress()' ontouchstart='startBtnPress()' ontouchend='cancelBtnPress()' ontouchcancel='cancelBtnPress()'>✓ Je savais</button>";
      html += "</div>";
      html += "<p id='btn-hint' class='btn-hint' style='display:" + (flipped?"block":"none") + "'>Appui long sur un bouton pour plus d'options</p>";
    } else {
      if (reviewMode) {
        html += "<p style='text-align:center;padding:3rem 0;color:#888'>Aucune carte archivée à réviser.<br><button onclick='exitReview()' style='margin-top:12px;padding:10px 18px;border-radius:12px;border:1.5px solid #009246;background:transparent;color:#009246;font-size:15px;cursor:pointer'>Retour au jeu normal</button></p>";
      } else {
        html += "<p style='text-align:center;padding:3rem 0;color:#888'>Aucune carte disponible.</p>";
      }
    }
  }

  if (view === "add") {
    html += "<div class='form-card'>";
    html += "<label class='form-label'>Mot en français</label>";
    html += "<input class='form-input' id='inp-fr' placeholder='ex : le vélo' />";
    html += "<label class='form-label'>Traduction italienne</label>";
    html += "<input class='form-input' id='inp-it' placeholder='ex : la bicicletta' />";
    html += "<label class='form-label'>Phrase d'exemple 1 <span style='color:#bbb;font-weight:400'>(facultatif)</span></label>";
    html += "<input class='form-input' id='inp-ex' placeholder='ex : Vado a scuola in bicicletta' />";
    html += "<label class='form-label'>Phrase d'exemple 2 <span style='color:#bbb;font-weight:400'>(facultatif)</span></label>";
    html += "<input class='form-input' id='inp-ex2' placeholder='ex : Mi piace la bicicletta rossa' onkeydown=\"if(event.key==='Enter')addCard()\" />";
    html += "<button class='btn-add' onclick='addCard()'>Ajouter la carte</button>";
    html += "<div id='add-msg' class='add-msg'></div>";
    html += "</div>";
  }

  if (view === "stats") {
    var activeCards = cards.filter(function(c){ return !c.archived; });
    var masteredCards = cards.filter(function(c){ return c.archived; });

    html += "<div id='sync-status' class='sync-status'>" + syncState + "</div>";

    html += "<div class='deck-top'>";
    html += "<input class='search-box' id='search-input' placeholder='🔍 Rechercher un mot...' value=\"" + esc(searchQuery) + "\" oninput='updateSearch(this.value)' />";
    html += "</div>";

    html += "<div class='export-btns'>";
    html += "<button class='btn-export' onclick='exportCards()'>⬇ Exporter</button>";
    html += "<button class='btn-import' onclick=\"document.getElementById('import-input').click()\">⬆ Importer</button>";
    html += "</div>";

    html += "<div class='list-block'>";
    html += "<div class='list-header'><span class='list-title'>Cartes en jeu <span class='count'>(" + activeCards.length + ")</span></span></div>";
    html += "<div class='list-scroll' id='active-list'>" + buildListHtml(false) + "</div>";
    html += "</div>";

    html += "<div class='list-block mastered-block'>";
    html += "<div class='list-header'>";
    html += "<span class='list-title'>Cartes archivées <span class='count' style='color:#9a7524'>(" + masteredCards.length + ")</span></span>";
    html += "<button class='collapse-btn' onclick='toggleMastered()'>" + (masteredOpen ? "Masquer ▲" : "Afficher ▼") + "</button>";
    html += "</div>";
    if (masteredOpen) {
      if (masteredCards.length > 0) {
        html += "<button class='btn-review-mastered' id='btn-review' onclick='startReviewDelayed()'>▶ Réviser les cartes archivées</button>";
      }
      html += "<div class='list-scroll' id='mastered-list'>" + buildListHtml(true) + "</div>";
    }
    html += "</div>";

    // Compte + déconnexion
    if (currentUser) {
      html += "<p style='text-align:center;font-size:12px;color:#aaa;margin-top:8px'>Connecté : " + esc(currentUser.email) + " · <button class='logout-link' onclick='doLogout()'>Déconnexion</button></p>";
    }
  }

  root.innerHTML = html;

  var doRestore = function() {
    var a2 = document.getElementById("active-list");
    var m2 = document.getElementById("mastered-list");
    if (a2 && savedScroll.active) a2.scrollTop = savedScroll.active;
    if (m2 && savedScroll.mastered) m2.scrollTop = savedScroll.mastered;
  };
  doRestore();
  requestAnimationFrame(doRestore);

  if (view === "study" && !reviewMode && card && isReturningCard(card)) {
    showReturningPopup(card.id);
  }
}

function buildListHtml(archived) {
  var list = cards.filter(function(c){ return archived ? c.archived : !c.archived; });
  list = list.slice().sort(function(a, b){ return b.id - a.id; });
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    list = list.filter(function(c) {
      return c.fr.toLowerCase().indexOf(q) !== -1 || stripAccent(c.it).toLowerCase().indexOf(q) !== -1;
    });
  }
  var html = "";
  list.forEach(function(c) {
    var s = scores[c.id] || {};
    var hist = (s.history || []).slice(-5);
    var dotsHtml = "";
    for (var di = 0; di < 5; di++) {
      var col = di < hist.length ? (hist[di] ? "#009246" : "#CE2B37") : "#ddd";
      dotsHtml += "<span style='display:inline-block;width:11px;height:11px;border-radius:50%;background:" + col + ";margin-left:3px'></span>";
    }
    var isSidelined = s.sidelined && Date.now() < s.sidelined;
    var isPriority = s.priority && Date.now() < s.priority;
    var badge = archived ? "" : (isSidelined ? " 💤" : (isPriority ? " 🔥" : ""));

    html += "<div class='stat-row'>";
    html += "<span class='stat-row-word' onmousedown='startPress(" + c.id + ")' onmouseup='cancelPress()' onmouseleave='cancelPress()' ontouchstart='startPress(" + c.id + ")' ontouchend='cancelPress()' ontouchcancel='cancelPress()'>" + esc(c.fr) + " → " + esc(stripAccent(c.it)) + badge + "</span>";
    html += "<span style='white-space:nowrap'>" + dotsHtml + "</span>";
    html += "<button class='row-plus' onclick='openRowMenu(" + c.id + "," + (archived ? "true" : "false") + ")'>+</button>";
    html += "</div>";
  });
  if (list.length === 0) html += "<p style='text-align:center;color:#aaa;font-size:14px;padding:1rem 0'>" + (archived ? "Aucune carte archivée" : "Aucune carte") + "</p>";
  return html;
}

function updateSearch(val) {
  searchQuery = val;
  var a = document.getElementById("active-list");
  if (a) a.innerHTML = buildListHtml(false);
  var m = document.getElementById("mastered-list");
  if (m) m.innerHTML = buildListHtml(true);
}

function toggleMastered() { masteredOpen = !masteredOpen; render(); }
function setView(v) {
  searchQuery = "";
  if (reviewMode) { reviewMode = false; buildDeck(); }
  view = v;
  render();
}

function flipCard() {
  flipped = !flipped;
  var inner = document.querySelector(".card-inner");
  var btns = document.getElementById("answer-btns");
  var hint = document.getElementById("btn-hint");
  if (inner) {
    if (flipped) {
      inner.classList.add("flipped");
      if (btns) btns.style.display = "flex";
      if (hint) hint.style.display = "block";
    } else {
      inner.classList.remove("flipped");
      if (btns) btns.style.display = "none";
      if (hint) hint.style.display = "none";
    }
  }
}

function startBtnPress() {
  btnPressTimer = setTimeout(function() { btnPressTimer = "long"; showAnswerOptions(); }, 600);
}
function cancelBtnPress() {
  if (btnPressTimer !== "long") clearTimeout(btnPressTimer);
}
function flashBtn(id, correct) {
  if (btnPressTimer === "long") { btnPressTimer = null; return; }
  clearTimeout(btnPressTimer);
  btnPressTimer = null;
  var btn = document.getElementById(id);
  var cardInner = document.querySelector(".card-inner");
  if (btn) btn.classList.add("flash");
  if (cardInner) {
    cardInner.style.outline = correct ? "3px solid #009246" : "3px solid #CE2B37";
    cardInner.style.boxShadow = correct ? "0 0 0 5px rgba(0,146,70,0.25)" : "0 0 0 5px rgba(206,43,55,0.25)";
    cardInner.style.borderRadius = "16px";
  }
  setTimeout(function() { answer(correct); }, 350);
}

function answer(correct) {
  var card = deck[idx];
  if (!card) return;
  lastCardId = card.id;
  var prev = scores[card.id] || { right: 0, wrong: 0, history: [] };
  var history = (prev.history || []).concat([correct]).slice(-10);
  scores[card.id] = Object.assign({}, prev, {
    right: correct ? (prev.right || 0) + 1 : (prev.right || 0),
    wrong: !correct ? (prev.wrong || 0) + 1 : (prev.wrong || 0),
    history: history
  });
  if (reviewMode) {
    if (correct) dailyStats.reviewRight++; else dailyStats.reviewWrong++;
  } else {
    if (correct) dailyStats.studyRight++; else dailyStats.studyWrong++;
  }
  saveDaily();
  save();
  buildDeck();
  var pool = Math.min(deck.length, 5);
  var candidates = [];
  for (var ci = 0; ci < pool; ci++) if (deck[ci].id !== lastCardId) candidates.push(ci);
  if (candidates.length === 0) {
    for (var cj = 0; cj < deck.length; cj++) if (deck[cj].id !== lastCardId) candidates.push(cj);
  }
  idx = candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : 0;
  flipped = false;
  render();
}

function addCard() {
  var fr = document.getElementById("inp-fr").value.trim();
  var it = document.getElementById("inp-it").value.trim();
  var ex = document.getElementById("inp-ex").value.trim();
  var ex2 = document.getElementById("inp-ex2").value.trim();
  var msg = document.getElementById("add-msg");
  if (!fr || !it) { msg.className = "add-msg err"; msg.textContent = "Remplis au moins le mot et sa traduction."; return; }
  cards.push({ id: nextId++, fr: fr, it: it, example: ex || null, example2: ex2 || null, emoji: null, archived: false });
  save(); buildDeck();
  document.getElementById("inp-fr").value = "";
  document.getElementById("inp-it").value = "";
  document.getElementById("inp-ex").value = "";
  document.getElementById("inp-ex2").value = "";
  msg.className = "add-msg ok";
  msg.textContent = "Carte \"" + fr + "\" ajoutée !";
}

function startPress(id) { pressTimer = setTimeout(function(){ openEditModal(id); }, 600); }
function cancelPress() { clearTimeout(pressTimer); }

function openRowMenu(id, archived) {
  var c = cards.find(function(x){ return x.id === id; });
  if (!c) return;
  var opts = "";
  opts += "<button class='modal-option' onclick='openEditModal(" + id + ")'>✏️ Modifier la carte</button>";
  if (archived) {
    opts += "<button class='modal-option reactivate' id='rm-react' onclick=\"flashOption('rm-react','flash-green', function(){ reactivateCard(" + id + "); })\">Remettre la carte en jeu</button>";
  } else {
    opts += "<button class='modal-option archive' id='rm-arch' onclick=\"flashOption('rm-arch','flash-gold', function(){ archiveCard(" + id + "); })\">Archiver la carte</button>";
  }
  opts += "<button class='modal-option danger' id='rm-del' onclick=\"flashOption('rm-del','flash-red', function(){ deleteFromMenu(" + id + "); })\">Supprimer la carte</button>";
  document.getElementById("modal-container").innerHTML =
    "<div class='modal-overlay' onclick='if(event.target===this)closeModal()'><div class='modal'>" +
    "<button class='modal-close' onclick='closeModal()'>×</button>" +
    "<h3>Options</h3><div style='margin-top:8px'>" + opts + "</div></div></div>";
}

function deleteFromMenu(id) {
  cards = cards.filter(function(c){ return c.id !== id; });
  delete scores[id];
  save(); buildDeck(); closeModal(); render();
}

function openEditModal(id) {
  var c = cards.find(function(x){ return x.id === id; });
  if (!c) return;
  document.getElementById("modal-container").innerHTML =
    "<div class='modal-overlay' onclick='if(event.target===this)closeModal()'><div class='modal'>" +
    "<button class='modal-close' onclick='closeModal()'>×</button>" +
    "<h3>✏️ Modifier la carte</h3>" +
    "<label class='form-label'>Mot en français</label>" +
    "<input class='form-input' id='edit-fr' value=\"" + esc(c.fr) + "\" />" +
    "<label class='form-label'>Traduction italienne</label>" +
    "<input class='form-input' id='edit-it' value=\"" + esc(c.it) + "\" />" +
    "<label class='form-label'>Phrase d'exemple 1</label>" +
    "<input class='form-input' id='edit-ex' value=\"" + esc(c.example) + "\" />" +
    "<label class='form-label'>Phrase d'exemple 2</label>" +
    "<input class='form-input' id='edit-ex2' value=\"" + esc(c.example2) + "\" />" +
    "<div class='modal-btns'>" +
    "<button class='btn-cancel' onclick='closeModal()'>Annuler</button>" +
    "<button class='btn-save' onclick='saveEdit(" + id + ")'>Enregistrer</button>" +
    "</div></div></div>";
}

function closeModal() { document.getElementById("modal-container").innerHTML = ""; }

function saveEdit(id) {
  var fr = document.getElementById("edit-fr").value.trim();
  var it = document.getElementById("edit-it").value.trim();
  var ex = document.getElementById("edit-ex").value.trim();
  var ex2 = document.getElementById("edit-ex2").value.trim();
  if (!fr || !it) return;
  var i = cards.findIndex(function(c){ return c.id === id; });
  if (i === -1) return;
  cards[i] = Object.assign({}, cards[i], { fr: fr, it: it, example: ex || null, example2: ex2 || null });
  save(); buildDeck(); closeModal(); render();
}

function showAnswerOptions() {
  var card = deck[idx];
  if (!card) return;
  var cardId = card.id;
  var modal = document.getElementById("modal-container");
  if (reviewMode) {
    modal.innerHTML =
      "<div class='modal-overlay' onclick='if(event.target===this)closeModal()'><div class='modal'>" +
      "<button class='modal-close' onclick='closeModal()'>×</button>" +
      "<h3>Options pour cette carte</h3>" +
      "<p class='modal-desc'>Remettre la carte en jeu : la carte quitte les archivées et redevient une carte de jeu normale.</p>" +
      "<button class='modal-option reactivate' id='opt-react' onclick=\"flashOption('opt-react','flash-green', function(){ reactivateCard(" + cardId + "); })\">Remettre la carte en jeu</button>" +
      "<button class='modal-option danger' id='opt-del' onclick=\"flashOption('opt-del','flash-red', function(){ deleteCardAndNext(" + cardId + "); })\">Supprimer la carte</button>" +
      "</div></div>";
  } else {
    modal.innerHTML =
      "<div class='modal-overlay' onclick='if(event.target===this)closeModal()'><div class='modal'>" +
      "<button class='modal-close' onclick='closeModal()'>×</button>" +
      "<h3>Options pour cette carte</h3>" +
      "<p class='modal-desc'>Mettre de côté : disparaît 1 mois puis revient.<br>Priorité maximale : apparaît 3× plus souvent 7 jours.<br>Archiver : place la carte dans les cartes archivées.</p>" +
      "<button class='modal-option sideline' id='opt-sideline' onclick=\"flashOption('opt-sideline','flash-blue', function(){ sidelineCard(" + cardId + "); })\">Mettre de côté 1 mois 💤</button>" +
      "<button class='modal-option priority' id='opt-priority' onclick=\"flashOption('opt-priority','flash-orange', function(){ prioritizeCard(" + cardId + "); })\">Priorité maximale 7 jours 🔥</button>" +
      "<button class='modal-option archive' id='opt-archive' onclick=\"flashOption('opt-archive','flash-gold', function(){ archiveCard(" + cardId + "); })\">Archiver la carte</button>" +
      "<button class='modal-option danger' id='opt-delete' onclick=\"flashOption('opt-delete','flash-red', function(){ deleteCardAndNext(" + cardId + "); })\">Supprimer la carte du deck</button>" +
      "</div></div>";
  }
}

function flashOption(id, flashClass, callback) {
  var btn = document.getElementById(id);
  if (btn) btn.classList.add(flashClass);
  setTimeout(callback, 350);
}

function sidelineCard(id) {
  var prev = scores[id] || { right: 0, wrong: 0, history: [] };
  scores[id] = Object.assign({}, prev, { sidelined: Date.now() + 30*24*60*60*1000 });
  save(); buildDeck(); closeModal(); render();
}
function prioritizeCard(id) {
  var prev = scores[id] || { right: 0, wrong: 0, history: [] };
  scores[id] = Object.assign({}, prev, { priority: Date.now() + 7*24*60*60*1000 });
  save(); buildDeck(); closeModal(); render();
}
function archiveCard(id) {
  var i = cards.findIndex(function(c){ return c.id === id; });
  if (i !== -1) cards[i].archived = true;
  save(); buildDeck(); closeModal(); render();
}
function reactivateCard(id) {
  var i = cards.findIndex(function(c){ return c.id === id; });
  if (i !== -1) cards[i].archived = false;
  save(); buildDeck(); closeModal(); render();
}
function deleteCardAndNext(id) {
  cards = cards.filter(function(c){ return c.id !== id; });
  delete scores[id];
  save(); buildDeck(); closeModal(); render();
}

function showReturningPopup(cardId) {
  document.getElementById("modal-container").innerHTML =
    "<div class='modal-overlay'><div class='modal'>" +
    "<h3>💤 Retour d'une carte</h3>" +
    "<p style='font-size:15px;color:#444;line-height:1.5;margin-bottom:16px'>Cette carte revient après 1 mois de pause 💤... tu la connais toujours ?</p>" +
    "<button class='btn-save' style='width:100%' onclick='dismissReturning(" + cardId + ")'>OK</button>" +
    "</div></div>";
}
function dismissReturning(cardId) {
  var s = scores[cardId];
  if (s && s.sidelined) { delete s.sidelined; save(); }
  closeModal();
}

function startReviewDelayed() {
  var btn = document.getElementById("btn-review");
  if (btn) { btn.style.transition = "background 0.15s, color 0.15s"; btn.style.background = "#C79A3B"; btn.style.color = "#fff"; }
  setTimeout(startReview, 350);
}
function startReview() { reviewMode = true; view = "study"; buildDeck(); render(); }
function exitReview() { reviewMode = false; buildDeck(); render(); }

function exportCards() {
  var data = { cards: cards, scores: scores };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "flashcards-italien.json"; a.click();
  URL.revokeObjectURL(url);
}

function importCardsFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (data.cards && Array.isArray(data.cards)) {
        cards = data.cards.map(normalizeCard);
        scores = data.scores || {};
        nextId = cards.length ? Math.max.apply(null, cards.map(function(c){ return c.id; })) + 1 : 1;
        save(); buildDeck(); render();
        alert(cards.length + " cartes importées avec succès !");
      } else { alert("Fichier invalide."); }
    } catch (err) { alert("Erreur lors de la lecture du fichier."); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

// ===== Authentification =====
function renderLogin(msg, msgType) {
  document.body.className = "";
  var root = document.getElementById("root");
  root.innerHTML =
    "<div class='login-wrap'>" +
    "<h1>🇮🇹 Flashcards Italien</h1>" +
    "<p>Connecte-toi avec ton adresse email pour retrouver tes cartes sur tous tes appareils.</p>" +
    "<input class='login-input' id='login-email' type='email' placeholder='ton@email.com' />" +
    "<button class='login-btn' id='login-btn' onclick='sendLoginLink()'>Recevoir le lien de connexion</button>" +
    "<div id='login-msg' class='login-msg " + (msgType || "") + "'>" + (msg || "") + "</div>" +
    "</div>";
}

async function sendLoginLink() {
  var emailEl = document.getElementById("login-email");
  var btn = document.getElementById("login-btn");
  var msg = document.getElementById("login-msg");
  var email = emailEl.value.trim();
  if (!email || email.indexOf("@") === -1) { msg.className = "login-msg err"; msg.textContent = "Entre une adresse email valide."; return; }
  btn.disabled = true; btn.textContent = "Envoi en cours...";
  var actionCodeSettings = { url: APP_URL, handleCodeInApp: true };
  try {
    await sendSignInLinkToEmail(auth, email, actionCodeSettings);
    window.localStorage.setItem("fc_emailForSignIn", email);
    msg.className = "login-msg ok";
    msg.innerHTML = "✓ Un lien de connexion a été envoyé à<br><b>" + esc(email) + "</b><br><br>Ouvre ta boîte mail et clique sur le lien pour te connecter. Tu peux fermer cet onglet.";
  } catch (err) {
    msg.className = "login-msg err";
    msg.textContent = "Erreur : " + (err && err.message ? err.message : "impossible d'envoyer le lien.");
    btn.disabled = false; btn.textContent = "Recevoir le lien de connexion";
  }
}

async function doLogout() {
  if (!confirm("Se déconnecter ? Tes cartes sont sauvegardées dans le cloud.")) return;
  try { await signOut(auth); } catch (e) {}
  window.location.reload();
}

// ===== Démarrage : gestion de l'état de connexion =====
async function completeEmailLinkSignIn() {
  if (isSignInWithEmailLink(auth, window.location.href)) {
    var email = window.localStorage.getItem("fc_emailForSignIn");
    if (!email) {
      // L'utilisateur a ouvert le lien sur un autre appareil : on lui redemande son email
      email = window.prompt("Confirme ton adresse email pour terminer la connexion :");
    }
    if (email) {
      try {
        await signInWithEmailLink(auth, email, window.location.href);
        window.localStorage.removeItem("fc_emailForSignIn");
        // Nettoie l'URL (retire les paramètres du lien)
        window.history.replaceState({}, document.title, APP_URL);
      } catch (err) {
        renderLogin("Erreur de connexion : le lien est peut-être expiré. Réessaie.", "err");
        return;
      }
    }
  }
}

onAuthStateChanged(auth, async function(user) {
  if (user) {
    currentUser = user;
    renderLoadingState();
    await loadFromCloud();
    buildDeck();
    render();
  } else {
    currentUser = null;
    renderLogin();
  }
});

function renderLoadingState() {
  var root = document.getElementById("root");
  root.innerHTML = "<div class='login-wrap'><h1>🇮🇹 Flashcards Italien</h1><p>Chargement de tes cartes...</p></div>";
}

// Expose les fonctions au scope global (pour les onclick inline)
window.setView = setView;
window.flipCard = flipCard;
window.startBtnPress = startBtnPress;
window.cancelBtnPress = cancelBtnPress;
window.flashBtn = flashBtn;
window.addCard = addCard;
window.startPress = startPress;
window.cancelPress = cancelPress;
window.openRowMenu = openRowMenu;
window.deleteFromMenu = deleteFromMenu;
window.openEditModal = openEditModal;
window.closeModal = closeModal;
window.saveEdit = saveEdit;
window.showAnswerOptions = showAnswerOptions;
window.flashOption = flashOption;
window.sidelineCard = sidelineCard;
window.prioritizeCard = prioritizeCard;
window.archiveCard = archiveCard;
window.reactivateCard = reactivateCard;
window.deleteCardAndNext = deleteCardAndNext;
window.showReturningPopup = showReturningPopup;
window.dismissReturning = dismissReturning;
window.startReviewDelayed = startReviewDelayed;
window.startReview = startReview;
window.exitReview = exitReview;
window.exportCards = exportCards;
window.updateSearch = updateSearch;
window.toggleMastered = toggleMastered;
window.sendLoginLink = sendLoginLink;
window.doLogout = doLogout;

document.getElementById("import-input").addEventListener("change", importCardsFile);

// Enregistrement du service worker
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

// Lancement : d'abord finaliser une éventuelle connexion par lien, puis laisser onAuthStateChanged gérer l'affichage
completeEmailLinkSignIn();
</script>
